name: Verify TorBox TV 0.2.7 portable vault and original playback
on:
  push:
    branches: [feature/torbox-tv-vault-027]
    paths:
      - '.github/workflows/torbox-tv-vault-027-check.yml'
      - 'native/torbox-tv/app/src/test/java/app/torboxtv/data/UpdatesTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout standalone on-device encryption helper
        uses: actions/checkout@v4
        with:
          repository: to-shreds/Misc
          ref: main
          path: vault-site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test phone Web Crypto helper and Android golden vector
        run: node --test vault-site/TorBoxVault/vault.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native source isolation, unit tests, lint and compile
        working-directory: native/torbox-tv
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python3 scripts/check_boundaries.py
          gradle --no-daemon --console=plain --no-build-cache -Pkotlin.incremental=false testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Free disk space for Android TV emulator
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android TV real Activity, cryptographic storage and remote regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: tv_1080p
          disk-size: 2048M
          enable-hw-keyboard: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            gradle -p native/torbox-tv --no-daemon --console=plain installDebug installDebugAndroidTest
            adb shell appops set app.torboxtv.stable REQUEST_INSTALL_PACKAGES allow
            gradle -p native/torbox-tv --no-daemon --console=plain --no-build-cache -Pkotlin.incremental=false connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torbox-tv-027-portable-vault-verification
          path: |
            native/torbox-tv/app/build/reports/
            native/torbox-tv/app/build/test-results/
            native/torbox-tv/app/build/outputs/androidTest-results/
          retention-days: 30
