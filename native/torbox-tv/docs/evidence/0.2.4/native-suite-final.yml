name: Native APK revision verification
on:
  push:
    branches: [verify/torbox-tv-0.2.4]
    paths:
      - "projects/torbox-tv/artifacts/verification-0.2.4/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-apk-revision
  cancel-in-progress: true
jobs:
  android:
    name: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract exact native source
        run: unzip -q projects/torbox-tv/artifacts/verification-0.2.4/TorBox-TV-0.2.4-candidate-source-r5.zip -d native
      - name: Android build tools and unit verification
        working-directory: native/torbox-tv
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          python3 scripts/check_boundaries.py
          gradle --no-daemon --console=plain --no-build-cache -Pkotlin.incremental=false testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Phone browser controls
        run: |
          npm install --prefix "$RUNNER_TEMP/phone-browser" --no-save playwright@1.62.1
          browser="$(command -v google-chrome || command -v chromium)"
          NODE_PATH="$RUNNER_TEMP/phone-browser/node_modules" CHROME_EXECUTABLE="$browser" node --test native/torbox-tv/test/browser/phone-remote.cjs
      - name: Free unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native TV tests and signed in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: tv_1080p
          disk-size: 2048M
          enable-hw-keyboard: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell wm size
            adb shell wm density
            gradle -p native/torbox-tv --no-daemon --console=plain installDebug installDebugAndroidTest
            adb shell appops set app.torboxtv REQUEST_INSTALL_PACKAGES allow
            gradle -p native/torbox-tv --no-daemon --console=plain --no-build-cache -Pkotlin.incremental=false connectedDebugAndroidTest
      - name: Summarize actual JVM and Android results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for root in ['native/torbox-tv/app/build/test-results', 'native/torbox-tv/app/build/outputs/androidTest-results']:
              files=list(pathlib.Path(root).rglob('TEST-*.xml'))
              total=failed=errors=skipped=0
              for p in files:
                  t=ET.parse(p).getroot()
                  total+=int(t.get('tests',0)); failed+=int(t.get('failures',0)); errors+=int(t.get('errors',0)); skipped+=int(t.get('skipped',0))
                  for case in t.iter('testcase'):
                      for tag in ('failure','error'):
                          for issue in case.findall(tag):
                              print(case.get('classname'),case.get('name'),tag,issue.get('message'),issue.text)
              print(root,dict(files=len(files),tests=total,failed=failed,errors=errors,skipped=skipped))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-final-evidence
          path: |
            native/torbox-tv/app/build/reports/
            native/torbox-tv/app/build/test-results/
            native/torbox-tv/app/build/outputs/androidTest-results/
            native-update-evidence/
          retention-days: 30
