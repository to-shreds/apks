name: Native APK checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preserve test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: torbox-tv-test-signing-v1
      - name: Unit tests, lint, APK and device-test APK
        run: |
          python3 scripts/check_boundaries.py
          gradle --no-daemon --no-build-cache -Pkotlin.incremental=false testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/TorBox-TV-0.2.5-CI-only.apk
          sha256sum release/TorBox-TV-0.2.5-CI-only.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TorBox-TV-build-and-test-evidence
          path: |
            release/
            app/build/reports/
            app/build/outputs/apk/androidTest/debug/
          retention-days: 30
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: tv_1080p
          disk-size: 2048M
          enable-hw-keyboard: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
            adb shell wm size 1920x1080
            adb shell wm density 320
            gradle --no-daemon installDebug installDebugAndroidTest
            adb shell appops set app.torboxtv REQUEST_INSTALL_PACKAGES allow
            gradle --no-daemon --no-build-cache -Pkotlin.incremental=false connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TorBox-TV-native-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

# CI uses a temporary test certificate. Publish original-certificate updates only
# after verification with scripts/prepare_update.py; see docs/APP-UPDATES.md.
